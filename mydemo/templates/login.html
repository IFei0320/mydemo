<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="智能旅游数据分析平台 - 登录" />
    <meta name="keywords" content="旅游,数据分析,登录,admin" />
    <title>旅游数据分析平台 - 登录</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #e8ecf1;
            position: relative;
        }

        .bg-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
        }

        .bg-circle:nth-child(1) {
            width: 600px;
            height: 600px;
            background: #a0aec0;
            top: -15%;
            right: -10%;
        }

        .bg-circle:nth-child(2) {
            width: 500px;
            height: 500px;
            background: #cbd5e0;
            bottom: -15%;
            left: -10%;
        }

        .bg-circle:nth-child(3) {
            width: 400px;
            height: 400px;
            background: #b8c5d6;
            top: 45%;
            left: 35%;
        }

        .glass-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .logo-text {
            color: #2d3748;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo-subtext {
            color: #718096;
            font-size: 13px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            overflow: hidden;
            animation: fadeInUp 0.8s ease;
        }

        .card-block {
            padding: 36px 32px;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-title h3 {
            color: #1a202c;
            font-weight: 700;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .auth-title p {
            color: #718096;
            font-size: 14px;
        }

        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            height: 52px;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 14px;
            padding: 12px 16px 12px 48px;
            font-size: 15px;
            color: #2d3748;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            outline: none;
            transition: all 0.3s ease;
            box-shadow:
                inset 0 1px 2px rgba(0,0,0,0.03),
                0 1px 4px rgba(0,0,0,0.04);
            font-family: inherit;
        }

        .form-control::placeholder {
            color: #a0aec0;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(76, 110, 245, 0.4);
            box-shadow:
                0 0 0 3px rgba(76, 110, 245, 0.08),
                inset 0 1px 2px rgba(0,0,0,0.03);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 16px;
            transition: color 0.3s;
            pointer-events: none;
        }

        .form-control:focus ~ .input-icon {
            color: #4c6ef5;
        }

        .remember-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 22px 0;
        }

        .checkbox-fade {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 8px;
            font-size: 14px;
            color: #4a5568;
            user-select: none;
        }

        .checkbox-fade input[type="checkbox"] {
            display: none;
        }

        .cr {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,0,0,0.12);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.6);
        }

        .checkbox-fade input[type="checkbox"]:checked + .cr {
            background: #4c6ef5;
            border-color: #4c6ef5;
        }

        .cr-icon {
            color: white;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .checkbox-fade input[type="checkbox"]:checked + .cr .cr-icon {
            opacity: 1;
        }

        .forgot-password {
            color: #4c6ef5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #3b5bdb;
        }

        .btn-login {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 14px;
            background: #4c6ef5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                0 4px 15px rgba(76, 110, 245, 0.25),
                inset 0 1px 0 rgba(255,255,255,0.2);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: #4263eb;
            transform: translateY(-2px);
            box-shadow:
                0 8px 25px rgba(76, 110, 245, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            position: relative;
            text-align: center;
            margin: 24px 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(0,0,0,0.08), transparent);
        }

        .divider-text {
            background: transparent;
            padding: 0 16px;
            color: #a0aec0;
            font-size: 13px;
            position: relative;
        }

        .register-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .register-text {
            color: #718096;
            font-size: 14px;
        }

        .register-link {
            color: #4c6ef5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link:hover {
            color: #3b5bdb;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .glass-container { padding: 16px; }
            .card-block { padding: 28px 20px; }
            .logo-text { font-size: 22px; }
            .remember-section {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
<base target="_blank">
</head>

<body themebg-pattern="theme1">
    <div class="bg-decoration">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <div class="glass-container">
        <div class="logo-section">
            <div class="logo-icon">✈️</div>
            <div class="logo-text">旅游数据分析平台</div>
            <div class="logo-subtext">Intelligent Tourism Data Analytics</div>
        </div>

        <form class="auth-box" id="loginForm">
            <div class="card-block">
                <div class="auth-title">
                    <h3>用户登录</h3>
                    <p>欢迎回来，请登录您的账户</p>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" name="username" class="form-control" placeholder="用户名 / 邮箱地址" required>
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" name="password" class="form-control" placeholder="登录密码" required>
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <div class="remember-section">
                    <label class="checkbox-fade">
                        <input type="checkbox" value="1" id="agree_terms" checked>
                        <span class="cr">
                            <span class="cr-icon">✓</span>
                        </span>
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span>立即登录</span>
                </button>

                <div class="divider">
                    <span class="divider-text">还没有账户？</span>
                </div>

                <div class="register-section">
                    <div class="register-text">
                        新用户？<a href="{% url 'user:register' %}" class="register-link">立即注册</a>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();

                var formData = $(this).serialize();
                var $btn = $('#loginBtn');
                var originalText = $btn.html();

                if (!$('#agree_terms').is(':checked')) {
                    alert('请阅读并同意条款和条件！');
                    return false;
                }

                $btn.prop('disabled', true).html('<span>登录中...</span>');

                $.ajax({
                    url: "{% url 'user:login' %}",
                    type: "post",
                    dataType: 'json',
                    data: formData,
                    success: function(response) {
                        if(response.code === 200) {
                            $btn.html('<span>登录成功</span>');
                            setTimeout(function() {
                                window.location.href = "/mydemo/";
                            }, 500);
                        } else {
                            alert(response.msg);
                            $btn.prop('disabled', false).html(originalText);
                        }
                    },
                    error: function(xhr, status, error) {
                        alert('登录失败，请稍后重试！');
                        $btn.prop('disabled', false).html(originalText);
                    }
                });
            });
        });
    </script>
</body>
</html>

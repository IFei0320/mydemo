<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="智能旅游数据分析平台 - 登录" />
    <meta name="keywords" content="旅游,数据分析,登录,admin" />
    <title>旅游数据分析平台 - 登录</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">

    <style>
        /* ====== login.html 页面特有样式 ====== */
        .remember-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 22px 0;
        }

        .forgot-password {
            color: #4c6ef5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .forgot-password:hover { color: #3b5bdb; }

        .register-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .register-text {
            color: #718096;
            font-size: 14px;
        }

        .register-link {
            color: #4c6ef5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link:hover { color: #3b5bdb; }

        @media (max-width: 480px) {
            .remember-section {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body themebg-pattern="theme1">
    <div class="bg-decoration">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <div id="toastMsg" class="toast-msg"></div>

    <div class="glass-container">
        <div class="logo-section">
            <div class="logo-icon">✈️</div>
            <div class="logo-text">旅游数据分析平台</div>
            <div class="logo-subtext">Intelligent Tourism Data Analytics</div>
        </div>

        <form class="auth-box" id="loginForm">
            <div class="card-block">
                <div class="auth-title">
                    <h3>用户登录</h3>
                    <p>欢迎回来，请登录您的账户</p>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" name="username" class="form-control" placeholder="用户名 / 邮箱地址" required>
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" name="password" class="form-control" placeholder="登录密码" required>
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <div class="remember-section">
                    <label class="checkbox-fade">
                        <input type="checkbox" value="1" id="agree_terms" checked>
                        <span class="cr">
                            <span class="cr-icon">✓</span>
                        </span>
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>

                <button type="submit" class="auth-btn" id="loginBtn">
                    <span>立即登录</span>
                </button>

                <div class="divider">
                    <span class="divider-text">还没有账户？</span>
                </div>

                <div class="register-section">
                    <div class="register-text">
                        新用户？<a href="{% url 'user:register' %}" class="register-link">立即注册</a>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    {% csrf_token %}
    <script>
        // CSRF：从 cookie 读取 token，所有 AJAX POST 自动携带
        function getCsrfToken() {
            var match = document.cookie.match(/csrftoken=([^;]+)/);
            return match ? match[1] : '';
        }
        $.ajaxSetup({
            beforeSend: function(xhr, settings) {
                if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type)) {
                    xhr.setRequestHeader("X-CSRFToken", getCsrfToken());
                }
            }
        });

        var toastTimer = null;
        function showToast(msg, type) {
            var $t = $('#toastMsg');
            clearTimeout(toastTimer);
            $t.removeClass('show error success').text(msg).addClass(type + ' show');
            toastTimer = setTimeout(function() {
                $t.removeClass('show');
            }, 2800);
        }

        $(document).ready(function() {
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();

                var formData = $(this).serialize();
                var $btn = $('#loginBtn');
                var originalText = $btn.html();

                if (!$('#agree_terms').is(':checked')) {
                    showToast('请阅读并同意条款和条件', 'error');
                    return false;
                }

                $btn.prop('disabled', true).html('<span>登录中...</span>');

                $.ajax({
                    url: "{% url 'user:login' %}",
                    type: "post",
                    dataType: 'json',
                    data: formData,
                    success: function(response) {
                        if(response.code === 200) {
                            $btn.html('<span>登录成功</span>');
                            setTimeout(function() {
                                window.location.href = "/mydemo/";
                            }, 500);
                        } else {
                            showToast(response.msg, 'error');
                            $btn.prop('disabled', false).html(originalText);
                        }
                    },
                    error: function(xhr, status, error) {
                        showToast('网络异常，请稍后重试', 'error');
                        $btn.prop('disabled', false).html(originalText);
                    }
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="智能旅游数据分析平台 - 注册" />
    <meta name="keywords" content="旅游,数据分析,注册,admin" />
    <title>旅游数据分析平台 - 注册</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">

    <style>
        /* ====== register.html 页面特有样式 ====== */
        .row {
            display: flex;
            gap: 16px;
            margin-bottom: 4px;
        }

        .col-sm-6 {
            flex: 1;
            min-width: 0;
        }

        .checkbox-fade { margin: 20px 0 24px; }

        .cr { flex-shrink: 0; }

        .login-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .login-text {
            color: #718096;
            font-size: 14px;
        }

        .login-link {
            color: #4c6ef5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-link:hover { color: #3b5bdb; }

        @media (max-width: 480px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <div class="bg-decoration">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <div id="toastMsg" class="toast-msg"></div>

    <div class="glass-container wide">
        <div class="logo-section">
            <div class="logo-icon">✈️</div>
            <div class="logo-text">旅游数据分析平台</div>
            <div class="logo-subtext">Intelligent Tourism Data Analytics</div>
        </div>

        <form class="auth-box" id="registerForm">
            <div class="card-block">
                <div class="auth-title">
                    <h3>用户注册</h3>
                    <p>创建您的新账户</p>
                </div>

                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                </div>

                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" name="email" class="form-control" placeholder="请输入邮箱地址" required>
                </div>

                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" placeholder="设置密码" required>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="form-label">确认密码</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="再次输入密码" required>
                        </div>
                    </div>
                </div>

                <label class="checkbox-fade">
                    <input type="checkbox" value="1" id="agree_terms">
                    <span class="cr">
                        <span class="cr-icon">✓</span>
                    </span>
                    <span>我已阅读并同意条款和条件</span>
                </label>

                <button type="submit" class="auth-btn" id="registerBtn">
                    <span>立即注册</span>
                </button>

                <div class="divider">
                    <span class="divider-text">已有账户？</span>
                </div>

                <div class="login-section">
                    <div class="login-text">
                        已有账号？<a href="{% url 'user:login' %}" class="login-link">回去登录</a>
                    </div>
                </div>
            </div>
        </form>
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
{% csrf_token %}
<script>
    function getCsrfToken() {
        var match = document.cookie.match(/csrftoken=([^;]+)/);
        return match ? match[1] : '';
    }
    $.ajaxSetup({
        beforeSend: function(xhr, settings) {
            if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type)) {
                xhr.setRequestHeader("X-CSRFToken", getCsrfToken());
            }
        }
    });

    var toastTimer = null;
    function showToast(msg, type) {
        var $t = $('#toastMsg');
        clearTimeout(toastTimer);
        $t.removeClass('show error success').text(msg).addClass(type + ' show');
        toastTimer = setTimeout(function() {
            $t.removeClass('show');
        }, 2800);
    }

    $(document).ready(function() {
        $('#registerForm').on('submit', function(e) {
            e.preventDefault();

            var formData = $(this).serialize();
            var password = $('input[name="password"]').val();
            var confirm_password = $('input[name="confirm_password"]').val();
            var $btn = $('#registerBtn');
            var originalText = $btn.html();

            if (password !== confirm_password) {
                showToast('两次输入的密码不一致', 'error');
                return false;
            }

            if (!$('#agree_terms').is(':checked')) {
                showToast('请阅读并同意条款和条件！', 'error');
                return false;
            }

            $btn.prop('disabled', true).html('<span>注册中...</span>');

            $.ajax({
                url: "{% url 'user:register' %}",
                type: "post",
                dataType: 'json',
                data: formData,
                success: function(response) {
                    if (response.code === 200) {
                        $btn.html('<span>注册成功</span>');
                        showToast(response.msg, 'success');
                        setTimeout(function() {
                            window.location.href = "{% url 'user:login' %}";
                        }, 700);
                    } else {
                        showToast(response.msg, 'error');
                        $btn.prop('disabled', false).html(originalText);
                    }
                },
                error: function() {
                    showToast('注册失败，请稍后重试！', 'error');
                    $btn.prop('disabled', false).html(originalText);
                }
            });
        });
    });
</script>
</body>
</html>

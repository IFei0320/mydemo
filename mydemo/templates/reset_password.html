<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>旅游数据分析平台 - 重置密码</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">

</head>

<body themebg-pattern="theme1">
    <div class="bg-decoration">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <div id="toastMsg" class="toast-msg"></div>

    <div class="glass-container">
        <div class="logo-section">
            <div class="logo-icon">🔑</div>
            <div class="logo-text">旅游数据分析平台</div>
            <div class="logo-subtext">重置您的账户密码</div>
        </div>

        <form class="auth-box" id="resetForm">
            <div class="card-block">
                <div class="auth-title">
                    <h3>重置密码</h3>
                    <p>请输入您的用户名和注册邮箱</p>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" name="username" class="form-control" placeholder="用户名" required>
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="email" name="email" class="form-control" placeholder="注册邮箱" required>
                        <span class="input-icon">📧</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" name="new_password" class="form-control" placeholder="新密码（至少6位）" required minlength="6">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="resetBtn">
                    <span>重置密码</span>
                </button>

                <div class="divider">
                    <span class="divider-text">想起密码了？</span>
                </div>

                <div class="register-section">
                    <div class="register-text">
                        <a href="{% url 'user:login' %}" class="register-link">返回登录</a>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    {% csrf_token %}
    <script>
        function getCsrfToken() {
            var match = document.cookie.match(/csrftoken=([^;]+)/);
            return match ? match[1] : '';
        }
        $.ajaxSetup({
            beforeSend: function(xhr, settings) {
                if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type)) {
                    xhr.setRequestHeader("X-CSRFToken", getCsrfToken());
                }
            }
        });

        var toastTimer = null;
        function showToast(msg, type) {
            var $t = $('#toastMsg');
            clearTimeout(toastTimer);
            $t.removeClass('show error success').text(msg).addClass(type + ' show');
            toastTimer = setTimeout(function() {
                $t.removeClass('show');
            }, 2800);
        }

        $(document).ready(function() {
            $('#resetForm').on('submit', function(e) {
                e.preventDefault();

                var formData = $(this).serialize();
                var $btn = $('#resetBtn');
                var originalText = $btn.html();

                $btn.prop('disabled', true).html('<span>提交中...</span>');

                $.ajax({
                    url: "{% url 'user:reset_password' %}",
                    type: "post",
                    dataType: 'json',
                    data: formData,
                    success: function(response) {
                        if(response.code === 200) {
                            $btn.html('<span>重置成功</span>');
                            showToast(response.msg, 'success');
                            setTimeout(function() {
                                window.location.href = "{% url 'user:login' %}";
                            }, 1500);
                        } else {
                            showToast(response.msg, 'error');
                            $btn.prop('disabled', false).html(originalText);
                        }
                    },
                    error: function(xhr, status, error) {
                        showToast('网络异常，请稍后重试', 'error');
                        $btn.prop('disabled', false).html(originalText);
                    }
                });
            });
        });
    </script>
</body>
</html>

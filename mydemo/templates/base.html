<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{% block title %}旅游数据分析平台{% endblock %}</title>
    {% load static %}
    <link rel="icon" href="{% static 'assets/images/favicon.ico' %}" type="image/x-icon">
    <style>
        body, * { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif; }

        /* 页面切换过渡 */
        .pcoded-main-container {
            animation: pageFadeIn 0.25s ease-out;
        }
        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        body.page-leaving .pcoded-main-container {
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.18s ease-in, transform 0.18s ease-in;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="{% static 'assets/css/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/pages/waves/css/waves.min.css' %}" type="text/css" media="all">
    <link rel="stylesheet" type="text/css" href="{% static 'assets/icon/themify-icons/themify-icons.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'assets/css/jquery.mCustomScrollbar.css' %}">

    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
</head>

<body>
    <!-- Header -->
    <nav class="pcoded-header">
        <div class="navbar-wrapper">
            <div class="navbar-logo">
                <a href="javascript:void(0)" class="mobile-menu" id="mobile-collapse">
                    <i class="ti-menu"></i>
                </a>
                <a href="{% url 'home:index' %}">
                    <img src="{% static 'assets/images/default-avatar.svg' %}" alt="Logo">
                </a>
                <a href="{% url 'home:index' %}" style="font-weight: 700; color: #1d1d1f; text-decoration: none; font-size: 17px;">
                    旅游数据分析平台
                </a>
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
                <ul class="nav-left">
                    <li>
                        <a href="javascript:void(0)" onclick="toggleFullScreen()">
                            <i class="ti-fullscreen"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <nav class="pcoded-navbar">
        <div class="pcoded-inner-navbar main-menu">
            <!-- 用户信息 -->
            <div class="main-menu-header">
                <img src="{{ request.session.avatar|default:'/static/assets/images/default-avatar.svg' }}" alt="User">
                <div class="user-details">
                    <span id="more-details">
                        {{ request.session.uname|default:'用户' }}
                        <i class="fa fa-caret-down"></i>
                    </span>
                </div>
            </div>

            <!-- 下拉菜单（默认可折叠） -->
            <div class="main-menu-content" id="userDropdown">
                <ul>
                    <li>
                        <a href="{% url 'user:changeInfo' %}"><i class="ti-user"></i>个人信息</a>
                    </li>
                    <li>
                        <a href="{% url 'user:logout' %}"><i class="ti-layout-sidebar-left"></i>退出登录</a>
                    </li>
                </ul>
            </div>

            <!-- 搜索 -->
            <div class="p-15">
                <form action="{% url 'home:travel_list' %}" method="get">
                    <div class="sidebar-search">
                        <i class="fa fa-search"></i>
                        <input type="text" name="search_name" placeholder="搜索景点..." required>
                    </div>
                </form>
            </div>

            <!-- 布局 -->
            <div class="pcoded-navigation-label">布局</div>
            <ul class="pcoded-item pcoded-left-item">
                <li data-menu="index">
                    <a data-url="{% url 'home:index' %}">
                        <span class="pcoded-micon"><i class="ti-home"></i></span>
                        <span class="pcoded-mtext">首页</span>
                    </a>
                </li>
                <li data-menu="travel_list">
                    <a data-url="{% url 'home:travel_list' %}">
                        <span class="pcoded-micon"><i class="ti-layout-grid2-alt"></i></span>
                        <span class="pcoded-mtext">国内旅游景点</span>
                    </a>
                </li>
            </ul>

            <!-- 数据分析 -->
            <div class="pcoded-navigation-label">数据分析 & 可视化</div>
            <ul class="pcoded-item pcoded-left-item">
                <li data-menu="part1">
                    <a data-url="{% url 'ksh:part1' %}">
                        <span class="pcoded-micon"><i class="ti-pie-chart"></i></span>
                        <span class="pcoded-mtext">景点评分信息</span>
                    </a>
                </li>
                <li data-menu="part2">
                    <a data-url="{% url 'ksh:part2' %}">
                        <span class="pcoded-micon"><i class="ti-layers"></i></span>
                        <span class="pcoded-mtext">景点热度分析</span>
                    </a>
                </li>
                <li data-menu="part3">
                    <a data-url="{% url 'ksh:part3' %}">
                        <span class="pcoded-micon"><i class="ti-line-dashed"></i></span>
                        <span class="pcoded-mtext">门票价格分析</span>
                    </a>
                </li>
                <li data-menu="part4">
                    <a data-url="{% url 'ksh:part4' %}">
                        <span class="pcoded-micon"><i class="ti-map"></i></span>
                        <span class="pcoded-mtext">景点地区分部</span>
                    </a>
                </li>
            </ul>

            <!-- AI推荐 -->
            <div class="pcoded-navigation-label">智能出行</div>
            <ul class="pcoded-item pcoded-left-item">
                <li data-menu="travelRoute">
                    <a data-url="{% url 'home:get_ai_travelRoute' %}">
                        <span class="pcoded-micon"><i class="ti-rocket"></i></span>
                        <span class="pcoded-mtext">目的地速览</span>
                    </a>
                </li>
                <li data-menu="nsga2">
                    <a data-url="{% url 'home:ai_nsga2_route' %}">
                        <span class="pcoded-micon"><i class="ti-stats-up"></i></span>
                        <span class="pcoded-mtext">智能路线规划</span>
                    </a>
                </li>
                <li data-menu="wiki">
                    <a data-url="{% url 'home:wiki_mvp' %}">
                        <span class="pcoded-micon"><i class="ti-book"></i></span>
                        <span class="pcoded-mtext">LLM Wiki MVP</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 侧边栏 active（紧跟在侧边栏后，首帧即正确） -->
    <script>
    (function() {
        var currentPath = window.location.pathname;
        var menuMap = {
            '/mydemo/index': 'index',
            '/mydemo/': 'index',
            '/mydemo/travel_list': 'travel_list',
            '/ksh/part1': 'part1',
            '/ksh/part2': 'part2',
            '/ksh/part3': 'part3',
            '/ksh/part4': 'part4',
            '/mydemo/get_ai_travelRoute': 'travelRoute',
            '/mydemo/ai_nsga2_route': 'nsga2',
            '/mydemo/wiki_mvp': 'wiki',
        };
        document.querySelectorAll('.pcoded-item li').forEach(function(li) {
            li.classList.remove('active');
        });
        var matched = false;
        for (var _i = 0, _entries = Object.entries(menuMap); _i < _entries.length; _i++) {
            var _entry = _entries[_i], path = _entry[0], menu = _entry[1];
            if (currentPath === path || currentPath.startsWith(path + '/')) {
                var target = document.querySelector('[data-menu="' + menu + '"]');
                if (target) { target.classList.add('active'); matched = true; }
                break;
            }
        }
        if (!matched) {
            var idx = document.querySelector('[data-menu="index"]');
            if (idx) idx.classList.add('active');
        }
    })();
    </script>

    <!-- Main Content -->
    <div class="pcoded-main-container">
        <div class="pcoded-content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'assets/js/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'assets/js/bootstrap/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'assets/pages/waves/js/waves.min.js' %}"></script>
    <script src="{% static 'assets/js/jquery-slimscroll/jquery.slimscroll.js' %}"></script>
    <script src="{% static 'assets/js/jquery.mCustomScrollbar.concat.min.js' %}"></script>
    <script src="{% static 'assets/js/pcoded.min.js' %}"></script>
    <script src="{% static 'assets/js/script.js' %}"></script>

    <script>
        // CSRF token：从 cookie 读取，供 jQuery AJAX 全局使用
        function getCsrfToken() {
            const match = document.cookie.match(/csrftoken=([^;]+)/);
            return match ? match[1] : '';
        }
        window.csrfToken = getCsrfToken();

        $.ajaxSetup({
            beforeSend: function(xhr, settings) {
                if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type)) {
                    xhr.setRequestHeader("X-CSRFToken", getCsrfToken());
                }
            }
        });

        // 全屏切换
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 移动端菜单切换
        document.getElementById('mobile-collapse').addEventListener('click', function() {
            document.querySelector('.pcoded-navbar').classList.toggle('open');
        });

        // 用户下拉菜单
        document.getElementById('more-details').addEventListener('click', function() {
            const dropdown = document.getElementById('userDropdown');
            const caret = this.querySelector('i');
            dropdown.classList.toggle('open');
            this.classList.toggle('open');
        });


        // 侧边栏 data-url 跳转
        document.querySelector('.pcoded-navbar').addEventListener('click', function(e) {
            const link = e.target.closest('a[data-url]');
            if (link) {
                e.preventDefault();
                document.body.classList.add('page-leaving');
                setTimeout(() => {
                    window.location.href = link.dataset.url;
                }, 180);
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
    <div style="display:none">{% csrf_token %}</div>
</body>
</html>
